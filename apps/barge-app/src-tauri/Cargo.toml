[package]
name = "barge-app"
description = "Barge's menu-bar app: machines and storage over the library, never the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
barge.workspace = true
barge-machine.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
longhorn-core.workspace = true
longhorn-config.workspace = true
longhorn-settings.workspace = true
longhorn-settings-config.workspace = true
longhorn-tauri-config.workspace = true
longhorn-tauri-settings.workspace = true
longhorn-storage-layout.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSBundle", "NSError", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
  "block2",
] }

[dev-dependencies]
barge = { workspace = true, features = ["testing"] }
# Unlocks tauri::test (mock app and runtime) for the command-level tests below.
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
