dot.bad{background:var(--danger)}.button{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600}.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:var(--soft);border-radius:12px;padding:20px;margin:20px 0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:20px}.count{font-size:28px;line-height:1;font-weight:650;font-variant-numeric:tabular-nums}.bar{height:6px;background:var(--line);border-radius:4px;margin-top:18px}.bar span{display:block;background:var(--accent);height:100%;width:55%;border-radius:4px}.detail{margin-top:36px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.metric{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:12px}.overlay{position:fixed;inset:0;background:#0c1421aa;display:grid;place-items:center}.dialog{background:var(--surface);border-radius:14px;width:430px;padding:28px;box-shadow:0 18px 55px #0005}.dialog h2{font-size:20px}.dialog p{margin:12px 0 24px}.dialog .actions{justify-content:flex-end}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.popoverwrap{min-height:100vh;background:var(--canvas);display:grid;place-items:center}.popover{background:var(--surface);width:360px;padding:22px;border-radius:14px;box-shadow:0 12px 45px #0003}.popover .row{padding:15px 0}.popover .actions{margin:18px 0}.popover .button{flex:1}.popover .footer{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between}.alert{color:var(--warning);font-weight:600}.link{color:var(--accent);font-weight:600}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(max-width:700px){.side{width:150px}.main{padding:30px 24px}.grid{grid-template-columns:1fr}.navfoot{margin-top:100px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><span>●</span> Barge</div><nav><
