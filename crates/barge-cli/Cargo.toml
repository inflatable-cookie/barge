[package]
name = "barge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Barge's thin CLI: parsing, the JSON envelope, exit codes and the human summary"

[[bin]]
name = "barge"
path = "src/main.rs"

[dependencies]
barge = { path = "../barge" }
barge-machine = { path = "../barge-machine" }
# The JSON envelope: the CLI encodes one document per command.
serde_json.workspace = true

# Tests use the storage library's `testing::TempDir`; the feature stays off in the
# library the binary links.
[dev-dependencies]
barge = { path = "../barge", features = ["testing"] }

[lints]
workspace = true
