[package]
name = "barge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Barge's thin CLI: parsing, the JSON envelope, exit codes and the human summary"

[[bin]]
name = "barge"
path = "src/main.rs"

[dependencies]
barge = { workspace = true }
barge-machine = { workspace = true }
# The JSON envelope: the CLI encodes one document per command.
serde_json.workspace = true
# The local time-zone offset for human output and the terminal's echo for
# `machine pair`: the CLI's only platform calls (src/human.rs, src/console.rs).
libc.workspace = true

# Tests use the storage library's `testing::TempDir`; the feature stays off in the
# library the binary links.
[dev-dependencies]
barge = { workspace = true, features = ["testing"] }

[lints]
workspace = true
