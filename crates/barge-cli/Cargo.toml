[package]
name = "barge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Barge's thin CLI: parsing, the JSON envelope, exit codes and the human summary"

[[bin]]
name = "barge"
path = "src/main.rs"

[dependencies]
barge = { path = "../barge" }
# The JSON envelope: the CLI encodes one document per command and the library
# types carry the field sets, so the same formats are used on both sides.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# The proof-only build of the CLI: the library's `proof-synthetic-account`, which
# no ordinary build enables.
[features]
proof-synthetic-account = ["barge/proof-synthetic-account"]

[lints]
workspace = true
