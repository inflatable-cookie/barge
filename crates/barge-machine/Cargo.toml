[package]
name = "barge-machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Barge's machine registry, Wake-on-LAN and daemon protocol types"

[dependencies]
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
# The client for `barged` (see the workspace manifest for why it carries no TLS
# stack).
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Tests use the storage library's `testing::TempDir`, so a fixture removes itself
# even when a test panics. The dependency is test-only, so `crates/barge`'s own
# dependency tree is unchanged.
[dev-dependencies]
barge = { path = "../barge" }

[lints]
workspace = true
