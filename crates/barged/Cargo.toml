[package]
name = "barged"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Barge's machine daemon: state and power control for one tailnet machine"

[[bin]]
name = "barged"
path = "src/main.rs"

[dependencies]
barge-machine = { path = "../barge-machine" }
serde.workspace = true
serde_json.workspace = true
httparse = "1"

# logind over D-Bus, Linux only (see the workspace manifest).
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[lints]
workspace = true
