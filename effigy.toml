[catalog]
alias = "barge"

[tasks]
"barge:install" = "python3 scripts/barge-install.py"
"barge:reinstall" = "python3 scripts/barge-install.py --replace"
"barge:install:test" = "PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-barge-install.py"
"docs:check" = [
  "python3 scripts/check-docs.py check-links",
  "python3 scripts/check-docs.py retired-concepts",
  "git diff --check HEAD",
]
# Ordinary Rust selectors run through the installed `oxide`, never raw `cargo`
# (AGENTS.md). `rust:lint` is the RustQuality strict profile's mechanical set:
# clippy::all plus the rustc lints the workspace manifests declare.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
"rust:lint" = "oxide clippy --workspace --all-targets --locked -- -D warnings"
# Read-only OS-layer diagnostic (crates/barge/examples/volume_probe.rs):
# BARGE_OS_PROBE_PATH names one directory to read, and nothing is written.
"os:volumes:probe" = "oxide run -p barge --locked --example volume_probe"
# The unit suite is defined once, under `[test.suites.rust]`; this task is
# Effigy's own task-ref composition so one name selects it.
"rust:test" = [{ task = "test rust" }]
# Individually bounded target runs support exact-head covering evidence.
"rust:test:prewarm" = "oxide test --admission-budget 300s --execution-budget 600s --workspace --all-targets --locked --no-run"
"rust:test:lib" = "oxide test --admission-budget 300s --execution-budget 600s --locked -p barge --lib"
"rust:test:native-harness" = "oxide test --admission-budget 300s --execution-budget 300s --locked -p barge --test native_proof_harness"
"rust:test:volume-probe" = "oxide test --admission-budget 300s --execution-budget 300s --locked -p barge --example volume_probe"
"rust:test:cli" = "oxide test --admission-budget 300s --execution-budget 300s --locked -p barge-cli --bin barge"
"rust:test:cli-contract" = "oxide test --admission-budget 300s --execution-budget 300s --locked -p barge-cli --test cli_contract"


# S6's elevated native proof (docs/knowledge/contracts/s6-native-proof.md).
# Owner-gated: the run attaches one owned APFS image and writes only inside the
# guard's scratch. Each selector builds the CLI from the same head and then runs
# the one fixed script under Oxide's pinned shared supervisor; the script refuses
# different supervisor bytes and refuses to run outside the supervisor.
"cache:native" = [
  "oxide build -p barge-cli --locked",
  "scripts/native/s6-cache-placement-proof.sh counted",
]
# The uncounted twin: keep-going, latched first fault, dependent-skip, and a
# `qualified: false` receipt. It proves nothing on its own.
"cache:native:diagnostic" = [
  "oxide build -p barge-cli --locked",
  "scripts/native/s6-cache-placement-proof.sh diagnostic",
]

# The proof's own apparatus self-check: the case map and its dispatch, the pinned
# supervisor digest and the installed bytes behind it, the nine-premise trace, the
# case ordering and registry restore guards, and the environment inventory. No
# image, no scratch and no child process.
"maintain:native:test" = "python3 scripts/native/s7-maintain-proof.py --self-check"
"space:native:test" = "python3 scripts/native/space-proof.py --self-check"
"space:native:plan" = "python3 scripts/native/space-proof.py --plan"

# F6-R1's release effect: the declaration side of its native proof only. The
# apparatus's case table is checked against the regressions that carry each case,
# and the plan prints the held bounds and activation order. No image, no scratch,
# no child process, and no native run exists: the native body is not built yet.
"release:native:test" = "python3 scripts/native/release-proof.py --self-check"
"release:native:plan" = "python3 scripts/native/release-proof.py --plan"

[test.suites.rust]
# The library and CLI suites. The budgets are the test route's timeout and
# forced exit: an expired admission window starts no child, and an expired
# execution window stops the owned group, so a hung test or leaked handle
# cannot keep the run open.
run = "oxide test --admission-budget 300s --execution-budget 300s --workspace --all-targets --locked"
default = false

# Slice S4's scratch expiry and deletion native: the frozen design's one bounded
# native, run under Oxide's qualified shared supervisor whose bytes this
# repository hash-pins (`scripts/run-scratch-expiry-native.py`) rather than
# writing a second supervisor. One owned APFS sparse image of at most 128 MiB
# attached `-owners on` inside the guard's own scratch, a 300 s wall clock, 512
# MiB of monitored scratch, ordinary detach with the backing kept, except for
# the one approved forced detach of the rebound owned disk in the live pull case.
# `--plan` is effect-free. The nine cases are exactly the design's list.
#
# HELD for owner activation: this declaration activates nothing, and no native
# receipt exists yet. The owner runs one uncounted diagnostic and then one
# counted pass, each separately, each at an exact head, with `BARGE_PROOF_BIN`
# naming the binary under test. A missing receipt is a missing proof.
[tasks."scratch:expiry:native"]
admission = "heavy"
run = "python3 scripts/run-scratch-expiry-native.py"

# The uncounted diagnostic of the same proof: recoverable faults are recorded,
# the first is latched, only its dependents are skipped, and the receipt says
# `qualified: false`. It is required before the counted run and is never counted
# native evidence.
[tasks."scratch:expiry:native:diagnostic"]
admission = "heavy"
run = "python3 scripts/run-scratch-expiry-native.py --diagnostic"

# Pure apparatus regression of the proof itself: the case map, the pinned
# supervisor digest, the nine-premise record, the product-census preflight (a
# real probe deletion whose custody is the Barge binary's own same-uid scan, with
# an infrastructure abort for a custody refusal and an apparatus-defect refusal
# for any other outcome), premise 2's complete-content real-state observation and
# fixture-only resolver proof, the ordinary-detach rules and the environment
# hook list.
# No image, no scratch, no child process.
[tasks."scratch:expiry:test"]
run = "python3 scripts/test-scratch-expiry.py --self-check"

# Proof-only interposer exercise: fresh caller scratch, no image or native proof.
[tasks."scratch:expiry:shim:test"]
run = "python3 scripts/test-scratch-enotempty-shim.py"

# S7's elevated native proof (docs/knowledge/contracts/s7-maintain-proof.md): the
# one bounded native for `barge maintain`, on one owned APFS image of at most
# 64 MiB attached `-owners on`, under Oxide's qualified shared supervisor whose
# bytes the script hash-pins itself. Its whole command is the one fixed script;
# the CLI under test is named by `BARGE_PROOF_BIN`, which the owner supplies from
# the head being proved. `--plan` is effect-free, so the proof's previews change
# nothing; only an authorised real run deletes, and only inside the guard's image.
#
# HELD for owner activation: the declarations activate nothing, and each run is
# separately activated (diagnostic first, then the counted pass at the exact
# head). A missing receipt is a missing proof.
[tasks."maintain:native"]
admission = "heavy"
run = "python3 scripts/native/s7-maintain-proof.py counted"

# The uncounted twin: keep-going, latched first fault, dependent-skip, and a
# `qualified: false` receipt. It proves nothing on its own.
[tasks."maintain:native:diagnostic"]
admission = "heavy"
run = "python3 scripts/native/s7-maintain-proof.py diagnostic"

# Stage 3's elevated space proof. Declarations do not activate a native run.
# The owner supplies BARGE_PROOF_BIN and separately activates the diagnostic,
# counted author and independent reviewer runs at the exact reviewed head.
[tasks."space:native"]
admission = "heavy"
run = "python3 scripts/native/space-proof.py counted"

[tasks."space:native:diagnostic"]
admission = "heavy"
run = "python3 scripts/native/space-proof.py diagnostic"
