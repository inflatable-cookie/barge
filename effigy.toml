[catalog]
alias = "barge"

[tasks]
"docs:check" = [
  "effigy skill run northstar/check-links",
  "effigy skill run northstar/retired-concepts",
  "git diff --check HEAD",
]
# Ordinary Rust selectors run through the installed `oxide`, never raw `cargo`
# (AGENTS.md). `rust:lint` is the RustQuality strict profile's mechanical set:
# clippy::all plus the rustc lints the workspace manifests declare.
"rust:compile" = "oxide check --workspace --all-targets --locked"
"rust:format" = "oxide fmt --all -- --check"
"rust:lint" = "oxide clippy --workspace --all-targets --locked -- -D warnings"
# Read-only OS-layer diagnostic (crates/barge/examples/volume_probe.rs):
# BARGE_OS_PROBE_PATH names one directory to read, and nothing is written.
"os:volumes:probe" = "oxide run -p barge --locked --example volume_probe"
# The unit suite is defined once, under `[test.suites.rust]`; this task is
# Effigy's own task-ref composition so one name selects it.
"rust:test" = [{ task = "test rust" }]

[test.suites.rust]
# The library and CLI suites. The budgets are the test route's timeout and
# forced exit: an expired admission window starts no child, and an expired
# execution window stops the owned group, so a hung test or leaked handle
# cannot keep the run open.
run = "oxide test --admission-budget 300s --execution-budget 300s --workspace --all-targets --locked"
default = false
