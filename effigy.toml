[catalog]
alias = "barge"

[tasks]
# Northstar's link check, the changelog check (one short fragment per unreleased
# change) and the whitespace check (AGENTS.md, "Validate").
"docs:check" = [
  "python3 scripts/check-docs.py check-links",
  "PYTHONDONTWRITEBYTECODE=1 python3 scripts/changelog.py check",
  "git diff --check HEAD",
]

# Rust runs through the installed `oxide`, never raw `cargo` (AGENTS.md).
# `rust:lint` is clippy::all plus the rustc lints the workspace manifests
# declare.
"rust:compile" = "oxide check --workspace --all-targets --all-features --locked"
"rust:format" = "oxide fmt --all -- --check"
"rust:format:apply" = "oxide fmt --all"
"rust:lint" = "oxide clippy --workspace --all-targets --all-features --locked -- -D warnings"
# The unit and integration suites are defined once under `[test.suites.rust]`;
# this task composes it so one name selects it.
"rust:test" = [{ task = "test rust" }]

"app:check" = "cd apps/barge-app && bun run check"
"app:test" = "cd apps/barge-app && bun run test"
# One command from the repo root: install the renderer's dependencies from the
# committed lockfile, then start the app through Oxide (AGENTS.md, "Validate").
"app:dev" = [
  "cd apps/barge-app && bun install --frozen-lockfile",
  "cd apps/barge-app && oxide exec -- bun run tauri dev",
]

[test.suites.rust]
# The whole workspace's suites: the library, the CLI, the machine client, the
# daemon and the app's Tauri backend. The budgets are the test route's timeout
# and forced exit: an expired admission window starts no child, and an expired
# execution window stops the owned group, so a hung test or a leaked hold cannot
# keep the run open.
run = "oxide test --admission-budget 300s --execution-budget 600s --workspace --all-targets --locked"
default = false
