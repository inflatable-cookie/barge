# Barge's workspace: the storage library, the thin CLI over it, the machine
# registry and the machine daemon (docs/knowledge/architecture.md, "Library
# surface"; docs/knowledge/machines.md, "Repository layout"), beside the app's
# Tauri backend (docs/knowledge/app.md).
[workspace]
members = ["crates/barge", "crates/barge-cli", "crates/barge-machine", "crates/barged", "apps/barge-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# The MSRV remains 1.97.1 for consumers even though this repository builds with
# the newer toolchain pinned in rust-toolchain.toml.
rust-version = "1.97.1"
# Barge is consumed by path or Git revision; it is never published to a registry.
publish = false
license = "MIT"
repository = "https://github.com/inflatable-cookie/barge"

# Shared dependency requirements. They are caret requirements, so a consumer
# that links Barge is not forced onto one exact patch release; `Cargo.lock`
# still pins every version this workspace builds.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The workspace's own crates, so every member names one place to change a path
# or enable a feature. `barge`'s `testing` feature is a dev-only request: the
# library a consumer links carries no test helpers.
barge = { path = "crates/barge" }
barge-machine = { path = "crates/barge-machine" }

# The one platform dependency. Every use of it sits behind the `os` layer
# (volume identity and free space) and the hold's `flock`; no other module names
# a syscall or errno.
libc = "0.2.190"

# The `barged` client: default features are off, so this is plain blocking
# HTTP/1.1 with no TLS stack, because the daemon speaks plain HTTP over the
# tailnet (docs/knowledge/machines.md, "Protocol and trust").
ureq = { version = "3.4.2", default-features = false }

# The daemon parses its small HTTP/1.1 request headers with this library; the
# server itself stays blocking, one thread, with no async runtime.
httparse = "1.10.1"

# Machine request authentication and the menu-bar app's Tauri runtime.
getrandom = "0.3.4"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-autostart = "2.7.0"

# The menu-bar app's Longhorn backbone, pinned at one `rev` so every member
# moves together (docs/knowledge/app.md, "Architecture").
longhorn-core = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }
longhorn-config = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }
longhorn-settings = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }
longhorn-settings-config = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }
longhorn-tauri-config = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }
longhorn-tauri-settings = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }
longhorn-storage-layout = { git = "https://github.com/inflatable-cookie/longhorn", rev = "a3e627f37b218de8d832e26f3fd84424d1f0096a" }

# logind over D-Bus, Linux only. The macOS workspace checks never build it, so
# the daemon still compiles (and reports state) on the Mac.
zbus = "5.19.0"

# The Dock icon refresh on macOS (menu-bar app only): the exact objc2
# generations Tauri 2.12.7 pulls in, so the app sets the same application
# icon image Tauri sets on Ready (see commands::window::show_main).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Workspace lints: clippy::all plus the rustc lints for API and unsafe hygiene,
# and the three "no panics outside tests" clippy lints. `clippy.toml` grants test
# code its exception (`allow-*-in-tests`), so a test may unwrap or panic while
# the shipped crates may not. Threshold lints (cognitive complexity,
# too_many_lines, type_complexity) are deliberately not gates.
[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# RUST-UNSAFE-001's named mechanical check: every unsafe block states the
# invariant it relies on in a SAFETY comment. Only the `os` macOS seam has any.
undocumented_unsafe_blocks = { level = "deny", priority = -1 }
# Panicking is never how a library or a binary reports a refusal.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Shared workspace profile: our own units keep the toolchain's dev debug
# recipe, while dependency units carry no debug info, so a test build stays
# small.
[profile.dev.package."*"]
debug = false
